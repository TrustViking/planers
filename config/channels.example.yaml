# Каналы владельца. Этот файл вы правите при каждом новом канале.
#
# Язык стримов назначает ОПЕРАТОР здесь, в languages. Планер не читает язык канала
# на YouTube как основание для решений и не меняет его: язык на YouTube справочный,
# он виден в выводе planer.bat --check и ни на что не влияет.
#
# Один канал на языке — один эфир на слот. Если два канала указали один и тот же язык,
# планер создаст два эфира и получит два разных ключа потока.

channels:
  - id: yt_ua                      # короткий ключ: латиница в нижнем регистре, цифры и _
                                   # им же назван файл токена: secrets\yt_ua.token.json
    platform: youtube              # сейчас поддерживается только youtube
    account_name: "Іван UA"        # ровно так, как канал называется в форме регистрации ключей
    languages: [uk]                # языки стримов этого канала — назначает оператор
    privacy: public                # public | unlisted — видимость создаваемых эфиров
    auto_start: true               # эфир стартует сам, когда стример начнёт слать поток
    set_thumbnail: true            # ставить превью из пакета (нужен подтверждённый канал)

  - id: yt_ru
    platform: youtube
    account_name: "Иван RU"
    languages: [ru, en]
