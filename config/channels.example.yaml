# Каналы владельца. Этот файл вы правите при каждом новом канале.
#
# Единственный шаблон этого файла — config\channels.example.yaml: если channels.yaml нет,
# планер копирует пример целиком. Рабочий channels.yaml отличается от примера только
# значениями и списком каналов, пояснения в обоих одинаковые.
#
# Язык стримов назначает ОПЕРАТОР здесь, в languages. Планер не читает язык канала
# на YouTube как основание для решений и не меняет его: язык на YouTube справочный,
# он виден в выводе planer.bat --check и ни на что не влияет.
#
# Один канал на языке — один эфир на слот. Если два канала указали один и тот же язык,
# планер создаст два эфира и получит два разных ключа потока.
#
# ------------------------------------------------------------------------------------
# Ключи канала: что делает, какие значения допустимы, что будет, если ключ не писать
# ------------------------------------------------------------------------------------
#
# id — обязательный. Короткий ключ канала: только латиница в нижнем регистре, цифры и _
#     (например yt_ua). У каждого канала свой, повторяться не может. Им назван файл
#     токена: secrets\<id>.token.json, и под ним в state\channels.json записано, какой
#     канал YouTube за ним стоит. Сменили id — канал придётся авторизовать заново:
#     planer.bat --auth <id>.
#
# platform — обязательный. Площадка канала. Допустимо только: youtube.
#     facebook пока не поддерживается (появится на этапе 6) — планер остановится
#     с понятной ошибкой; любое другое значение — ошибка со списком допустимых.
#
# account_name — обязательный, непустая строка. Название канала ровно так, как оно
#     записано в форме регистрации ключей: это значение уходит в форму вместе с ключом,
#     по нему стример узнаёт канал. Им же подписаны строки отчёта и keys.txt.
#
# languages — обязательный, непустой список кодов строчными буквами без повторов,
#     например [uk] или [ru, en]. Канал получает эфиры только по слотам этих языков.
#     Допустимы ровно те коды, для которых в форме регистрации ключей есть вариант
#     ответа. Сейчас в форме: uk (украинский), ru (русский), en (английский),
#     hu (венгерский). Этот список ведёт владелец формы, и он может измениться.
#     Язык вне списка планер не отвергает: эфир создастся, но ключ в форму не уйдёт —
#     в отчёте будет причина missingOption («в форме нет нужного варианта ответа»),
#     ключ придётся передать стримеру из keys.txt вручную.
#
# privacy — необязательный. Видимость эфиров, которые создаёт планер. Ровно два значения:
#     public   — эфир виден всем: на канале, в поиске, подписчикам;
#     unlisted — эфир доступен только по ссылке, подписчики и поиск его не видят.
#     Третьего значения (private) нет — это ошибка конфига.
#     Не написан — public. Действует на новые эфиры; уже созданные планер не меняет.
#
# auto_start — необязательный: true или false.
#     true  — эфир стартует сам, как только стример начнёт слать поток;
#     false — эфир сам не стартует: придётся запускать его вручную в Студии YouTube.
#     Не написан — true. Действует на новые эфиры; уже созданные планер не меняет.
#
# set_thumbnail — необязательный: true или false.
#     true  — планер ставит новому эфиру превью из пакета (случайное из превью слота).
#             Нужен подтверждённый канал; если YouTube откажет, эфир и ключ остаются
#             в силе, а отказ попадает в отчёт предупреждением;
#     false — превью из пакета не ставится, у эфира будет обложка по умолчанию YouTube.
#     Не написан — true.
#
# category_id — необязательный, строка в кавычках. Категория, в которой эфир увидят
#     зрители; список идентификаторов общий у YouTube: "22" — People & Blogs,
#     "25" — News & Politics, "24" — Entertainment. Планер значение не проверяет:
#     неизвестный идентификатор вернёт ошибку площадки, и она попадёт в отчёт.
#     Планер выставляет категорию каждому своему эфиру на каждом запуске.
#     Не написан — "22".

channels:
  - id: yt_ua                      # короткий ключ: латиница в нижнем регистре, цифры и _
                                   # им же назван файл токена: secrets\yt_ua.token.json
    platform: youtube              # только youtube
    account_name: "Іван UA"        # ровно так, как канал называется в форме регистрации ключей
    languages: [uk]                # коды из формы: uk | ru | en | hu
    privacy: public                # public | unlisted; не написан — public
    auto_start: true               # true | false (старт вручную в Студии); не написан — true
    set_thumbnail: true            # true | false (превью из пакета не ставится); не написан — true
    category_id: "22"              # идентификатор категории YouTube; не написан — "22"

  - id: yt_ru                      # канал с умолчаниями: privacy public, auto_start true,
    platform: youtube              # set_thumbnail true, category_id "22"
    account_name: "Иван RU"
    languages: [ru, en]
